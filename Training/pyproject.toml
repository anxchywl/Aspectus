[project]
name = "aspectus-gaze-training"
version = "0.1.0"
description = "Offline training and Core ML conversion for the Aspectus gaze estimator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "coremltools==9.0",
    "numpy==2.5.1",
    "onnx==1.18.0",
    "onnx2torch==1.5.15",
    "pillow==12.3.0",
    "torch==2.7.0",
    "torchvision==0.22.0",
]
