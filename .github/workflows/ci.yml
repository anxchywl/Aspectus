name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # a run that was never scheduled cannot be re-run, so there has to be a way to ask for one by hand
  workflow_dispatch:

concurrency:
  # a push gets a group to itself: one stuck run must not be able to block every commit behind it,
  # which is what happened while Actions was down and a zombie run could not be cancelled by the
  # UI, the API, or the force-cancel endpoint. a pull request keeps the shared group, since there
  # superseding the previous run is the point
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & Quality
    runs-on: macos-latest
    # the job has never taken longer than 90 s; a run that sits for an hour is a lost runner, and
    # it should say so rather than look like it might still pass
    timeout-minutes: 15

    steps:
      # the whitespace check diffs against HEAD~1, which a depth-1 clone does not have
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Report toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build AspectusKit
        run: swift build -v

      - name: Build AspectusKit in release
        run: swift build -c release

      - name: Run tests
        run: swift test

      # on a pull request HEAD is the merge commit, so this covers the whole branch; on a push it
      # covers the last commit only, which is what a depth-2 clone can see
      - name: Check for whitespace errors
        run: git diff --check HEAD~1 HEAD

  spec:
    name: Project Spec
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Provide a signing config
        run: cp scripts/Signing.xcconfig.example Signing.xcconfig

      # project.yml is hand-maintained and the .xcodeproj is generated, so a broken spec is
      # otherwise only discovered by whoever next runs xcodegen locally
      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Verify the camera extension target is present
        run: |
          set -euo pipefail
          xcodebuild -project Aspectus.xcodeproj -list | grep -q AspectusCameraExtension
          echo "camera extension target present"

      - name: Check the release script parses
        run: bash -n scripts/package-release.sh

# Deliberately absent: any job that signs, notarizes or publishes.
#
# Those need a Developer ID private key and an app-specific password, and putting them in GitHub
# secrets would be a permanent credential exposure on a public repository. Releases are cut locally
# with scripts/package-release.sh, which refuses to label an unsigned or unnotarized build as
# notarized. See docs/DESIGN.md and the script's header for the reasoning.
